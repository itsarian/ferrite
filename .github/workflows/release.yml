name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.1, defaults to package version if omitted)'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Dry run (build assets and compute checksums without publishing to GitHub Releases)'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create GitHub Release as draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  metadata:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      is_draft: ${{ steps.meta.outputs.is_draft }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_dry_run: ${{ steps.meta.outputs.is_dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [[ "$RAW_TAG" == v* ]]; then
            VERSION="${RAW_TAG#v}"
            TAG_NAME="$RAW_TAG"
          else
            PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version' 2>/dev/null || echo "0.1.1")
            VERSION="${PKG_VERSION}"
            TAG_NAME="v${PKG_VERSION}"
          fi

          IS_PRERELEASE="false"
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          elif [[ "$TAG_NAME" =~ -(alpha|beta|rc|dev) ]]; then
            IS_PRERELEASE="true"
          fi

          IS_DRAFT="false"
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then
            IS_DRAFT="true"
          fi

          IS_DRY_RUN="false"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            IS_DRY_RUN="true"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_draft=${IS_DRAFT}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_dry_run=${IS_DRY_RUN}" >> "$GITHUB_OUTPUT"

          echo "=========================================================="
          echo " Release Configuration:"
          echo "  Tag:         $TAG_NAME"
          echo "  Version:     $VERSION"
          echo "  Draft:       $IS_DRAFT"
          echo "  Pre-release: $IS_PRERELEASE"
          echo "  Dry Run:     $IS_DRY_RUN"
          echo "=========================================================="

  build-macos:
    name: Build macOS (${{ matrix.target-name }})
    needs: metadata
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target-name: Apple Silicon (arm64)
            arch: arm64
            rust-target: aarch64-apple-darwin
            artifact-name: macos-arm64
            cache-key: macos-arm64-release
          - target-name: Intel (x86_64)
            arch: x86_64
            rust-target: x86_64-apple-darwin
            artifact-name: macos-x86_64
            cache-key: macos-x86_64-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}

      - name: Build and Package macOS Installers
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh scripts/*.swift resources/pkg-scripts/*
          ./scripts/package-macos.sh --arch ${{ matrix.arch }}

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
            dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-linux:
    name: Build Linux GUI & CLI (${{ matrix.arch }})
    needs: metadata
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            arch: x86_64
            artifact-name: linux-x86_64
            cache-key: linux-x86_64-release
          - runs-on: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            arch: arm64
            artifact-name: linux-arm64
            cache-key: linux-arm64-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config libssl-dev \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libfontconfig1-dev \
            libasound2-dev libpulse-dev \
            dpkg-dev fakeroot rpm appstream \
            wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.cache-key }}

      - name: Build Linux Binaries (GUI + CLI + Native Host)
        shell: bash
        run: |
          cargo build --release -p ferrite-gui -p ferrite-cli -p ferrite-native-host

      - name: Package Linux Standalone Tarball
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/package-linux-tarball.sh --arch ${{ matrix.arch }} --skip-build

      - name: Package Linux .deb (Debian/Ubuntu)
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/package-linux-deb.sh --arch ${{ matrix.arch }} --skip-build

      - name: Package Linux .rpm (Fedora/RHEL/openSUSE)
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/package-linux-rpm.sh --arch ${{ matrix.arch }} --skip-build

      - name: Package Linux .AppImage (Portable)
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/package-linux-appimage.sh --arch ${{ matrix.arch }} --skip-build

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          retention-days: 1
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [metadata, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release asset names and compute unified SHA256 checksums
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt *.sha256

          echo "==> Validating canonical release asset names..."
          CANONICAL_REGEX='^ferrite-[0-9A-Za-z.+-]+-(linux|macos)-(x86_64|arm64)\.(dmg|pkg|zip|tar\.gz|deb|rpm|AppImage)$'
          shopt -s nullglob
          ASSETS=(*)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "ERROR: No release assets found in release-assets/."
            exit 1
          fi

          INVALID=0
          for asset in "${ASSETS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "ERROR: Unexpected non-file entry in release-assets/: $asset"
              INVALID=1
            elif [[ ! "$asset" =~ $CANONICAL_REGEX ]]; then
              echo "ERROR: Release asset does not match canonical naming contract: $asset"
              INVALID=1
            fi
          done

          if [ "$INVALID" -ne 0 ]; then
            echo "Expected pattern: $CANONICAL_REGEX"
            exit 1
          fi

          EXPECTED_ASSETS=(
            "ferrite-${VERSION}-macos-arm64.dmg"
            "ferrite-${VERSION}-macos-arm64.pkg"
            "ferrite-${VERSION}-macos-arm64.tar.gz"
            "ferrite-${VERSION}-macos-arm64.zip"
            "ferrite-${VERSION}-macos-x86_64.dmg"
            "ferrite-${VERSION}-macos-x86_64.pkg"
            "ferrite-${VERSION}-macos-x86_64.tar.gz"
            "ferrite-${VERSION}-macos-x86_64.zip"
            "ferrite-${VERSION}-linux-arm64.AppImage"
            "ferrite-${VERSION}-linux-arm64.deb"
            "ferrite-${VERSION}-linux-arm64.rpm"
            "ferrite-${VERSION}-linux-arm64.tar.gz"
            "ferrite-${VERSION}-linux-x86_64.AppImage"
            "ferrite-${VERSION}-linux-x86_64.deb"
            "ferrite-${VERSION}-linux-x86_64.rpm"
            "ferrite-${VERSION}-linux-x86_64.tar.gz"
          )

          MISSING=0
          for expected in "${EXPECTED_ASSETS[@]}"; do
            if [ ! -f "$expected" ]; then
              echo "ERROR: Missing expected release asset: $expected"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi

          if [ "${#ASSETS[@]}" -ne "${#EXPECTED_ASSETS[@]}" ]; then
            echo "ERROR: Expected ${#EXPECTED_ASSETS[@]} release assets, found ${#ASSETS[@]}."
            printf '  %s\n' "${ASSETS[@]}"
            exit 1
          fi

          echo "==> All ${#ASSETS[@]} release assets match canonical naming."
          echo "==> Computing sorted SHA256 checksums for all release assets..."
          SORTED_ASSETS=()
          while IFS= read -r asset; do
            SORTED_ASSETS+=("$asset")
          done < <(printf '%s\n' "${ASSETS[@]}" | LC_ALL=C sort)

          LC_ALL=C sha256sum "${SORTED_ASSETS[@]}" > SHA256SUMS.txt

          echo "=========================================================="
          echo " Generated SHA256SUMS.txt:"
          echo "=========================================================="
          cat SHA256SUMS.txt
          echo "=========================================================="

          echo "==> Verifying SHA256 checksums..."
          sha256sum -c SHA256SUMS.txt

      - name: Report Dry Run Summary
        if: needs.metadata.outputs.is_dry_run == 'true'
        shell: bash
        run: |
          echo "=========================================================="
          echo " [DRY RUN] GitHub Release was NOT created."
          echo " Tag:         ${{ needs.metadata.outputs.tag_name }}"
          echo " Version:     ${{ needs.metadata.outputs.version }}"
          echo " Draft:       ${{ needs.metadata.outputs.is_draft }}"
          echo " Pre-release: ${{ needs.metadata.outputs.is_prerelease }}"
          echo "=========================================================="
          echo " Verified Release Assets:"
          cat release-assets/SHA256SUMS.txt
          echo "=========================================================="

      - name: Publish GitHub Release
        if: needs.metadata.outputs.is_dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag_name }}
          name: Ferrite ${{ needs.metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          draft: ${{ needs.metadata.outputs.is_draft == 'true' }}
          prerelease: ${{ needs.metadata.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Ferrite ${{ needs.metadata.outputs.tag_name }}

            Ferrite is a high-performance, modular, modern download manager for macOS and Linux.

            ### Naming Convention
            All release assets follow the canonical format `ferrite-<version>-<os>-<arch>.<ext>`.

            ### Package Assets
            - **macOS (`arm64` — Apple Silicon)**:
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-arm64.dmg` — Disk image installer
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-arm64.pkg` — Native macOS installer package
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-arm64.zip` — Standalone `Ferrite.app` bundle
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-arm64.tar.gz` — Portable CLI & GUI archive
            - **macOS (`x86_64` — Intel)**:
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-x86_64.dmg` — Disk image installer
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-x86_64.pkg` — Native macOS installer package
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-x86_64.zip` — Standalone `Ferrite.app` bundle
              - `ferrite-${{ needs.metadata.outputs.version }}-macos-x86_64.tar.gz` — Portable CLI & GUI archive
            - **Linux (`x86_64`)**:
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-x86_64.deb` — Debian/Ubuntu package (`dpkg`, `apt`)
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-x86_64.rpm` — Fedora/RHEL/openSUSE package (`rpm`, `dnf`, `zypper`)
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-x86_64.AppImage` — Portable self-contained executable
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-x86_64.tar.gz` — Standalone archive with GUI, CLI, native host, and install scripts
            - **Linux (`arm64` / `aarch64`)**:
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-arm64.deb` — Debian/Ubuntu package (`dpkg`, `apt`)
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-arm64.rpm` — Fedora/RHEL/openSUSE package (`rpm`, `dnf`, `zypper`)
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-arm64.AppImage` — Portable self-contained executable
              - `ferrite-${{ needs.metadata.outputs.version }}-linux-arm64.tar.gz` — Standalone archive with GUI, CLI, native host, and install scripts
            - **Checksums**: `SHA256SUMS.txt` containing SHA256 digests for all 16 published assets

            > **Note:** Pre-built Windows release binaries are not yet published by CI.

            ### Verifying Release Assets
            To verify the integrity of your download using `SHA256SUMS.txt`:
            - **macOS**:
              ```bash
              shasum -a 256 -c SHA256SUMS.txt --ignore-missing
              ```
            - **Linux**:
              ```bash
              sha256sum -c SHA256SUMS.txt --ignore-missing
              ```
