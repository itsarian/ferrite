[package]
name = "ferrite-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ferrite"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
ferrite-batch = { path = "../ferrite-batch" }
ferrite-bt = { path = "../ferrite-bt" }
ferrite-core = { path = "../ferrite-core" }
ferrite-hls = { path = "../ferrite-hls" }
ferrite-http = { path = "../ferrite-http" }
ferrite-ipc = { path = "../ferrite-ipc" }
ferrite-media = { path = "../ferrite-media" }
ferrite-native-host = { path = "../ferrite-native-host" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
aes = "0.8"
cbc = "0.1"
