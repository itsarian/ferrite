[package]
name = "ferrite-media"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
boa_engine = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ferrite-core = { path = "../ferrite-core" }
ferrite-hls = { path = "../ferrite-hls" }
ferrite-http = { path = "../ferrite-http" }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "socks", "stream", "gzip", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = "0.26"
