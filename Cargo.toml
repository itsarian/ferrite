[workspace]
resolver = "2"
members = [
    "crates/ferrite-core",
    "crates/ferrite-batch",
    "crates/ferrite-http",
    "crates/ferrite-hls",
    "crates/ferrite-bt",
    "crates/ferrite-media",
    "crates/ferrite-ipc",
    "crates/ferrite-native-host",
    "crates/ferrite-cli",
    "crates/ferrite-gui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"

[patch.crates-io]
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp", branch = "main" }
xattr = { path = "patches/xattr" }

