[workspace]
resolver = "2"
members = [
    "crates/fdm-core",
    "crates/fdm-batch",
    "crates/fdm-http",
    "crates/fdm-hls",
    "crates/fdm-bt",
    "crates/fdm-media",
    "crates/fdm-ipc",
    "crates/fdm-native-host",
    "crates/fdm-cli",
    "crates/fdm-gui",
]

[workspace.package]
version = "0.3.0"
edition = "2024"

[patch.crates-io]
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp", branch = "main" }
xattr = { path = "patches/xattr" }

