[workspace]
resolver = "2"
members = [
    "crates/ferrite-core",
    "crates/ferrite-batch",
    "crates/ferrite-http",
    "crates/ferrite-hls",
    "crates/ferrite-bt",
    "crates/ferrite-media",
    "crates/ferrite-ipc",
    "crates/ferrite-native-host",
    "crates/ferrite-cli",
    "crates/ferrite-gui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
description = "A modern, native download manager built for speed, control, and privacy"
repository = "https://github.com/itsarian/ferrite"
homepage = "https://github.com/itsarian/ferrite"
license = "MIT OR Apache-2.0"
readme = "README.md"

[patch.crates-io]
# Pinned to the upstream `main` branch revision recorded in `Cargo.lock` for uTP fixes used by `librqbit`.
librqbit-utp = { git = "https://github.com/ikatson/librqbit-utp", branch = "main" }
# Local Linux compatibility fix (`ENOATTR` -> `ENODATA`) for legacy `xattr 0.2.3` pulled in by `zed-async-tar`.
xattr = { path = "patches/xattr" }

