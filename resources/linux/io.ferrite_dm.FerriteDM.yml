app-id: io.ferrite_dm.FerriteDM
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: fdm-gui

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=home
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.NetworkManager

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/ferrite-dm/cargo

modules:
  - name: ferrite-dm
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p fdm-gui -p fdm-cli -p fdm-native-host
      - install -Dm755 target/release/fdm-gui /app/bin/fdm-gui
      - install -Dm755 target/release/ferrite-dm /app/bin/ferrite-dm
      - install -Dm755 target/release/ferrite-native-host /app/bin/ferrite-native-host
      - install -Dm644 resources/linux/ferrite-dm.desktop /app/share/applications/io.ferrite_dm.FerriteDM.desktop
      - install -Dm644 resources/linux/io.ferrite_dm.FerriteDM.metainfo.xml /app/share/metainfo/io.ferrite_dm.FerriteDM.metainfo.xml
      - |
        for size in 16 32 48 64 128 256 512 1024; do
          install -Dm644 resources/linux/icons/hicolor/${size}x${size}/apps/ferrite-dm.png /app/share/icons/hicolor/${size}x${size}/apps/io.ferrite_dm.FerriteDM.png
        done
        install -Dm644 resources/linux/icons/hicolor/scalable/apps/ferrite-dm.svg /app/share/icons/hicolor/scalable/apps/io.ferrite_dm.FerriteDM.svg
    sources:
      - type: git
        url: https://github.com/itsarian/ferrite-dm.git
        tag: v0.1.1
